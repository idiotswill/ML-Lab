name: CI

# PR branches run once via pull_request; main also runs on push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Install Qt runtime libraries on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src/ml_lab
      - run: uv run pytest -m "not scale"
      - run: uv run python -m ml_lab --smoke-test
      - run: uv run python -m ml_lab --job-smoke-test
      - run: uv run python -m ml_lab --restart-recovery-smoke-test
      - name: QML load smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: uv run python -m ml_lab --qml-smoke-test
      - name: Full workspace QML smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: uv run python -m ml_lab.ui.workspace_smoke
      - name: Performance instrumentation smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: uv run python -m ml_lab --performance-probe

  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Install Qt runtime libraries on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Phase 3 scale gates
        run: uv run pytest -m scale

  windows-standalone:
    runs-on: windows-latest
    needs: [core, scale]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Build standalone executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke compiled application and worker boundary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "MLLab.exe" | Select-Object -First 1
          if (-not $exe) { throw "MLLab.exe was not produced" }
          Write-Host "Executable: $($exe.FullName) ($($exe.Length) bytes)"
          & $exe.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Compiled storage smoke failed" }
          & $exe.FullName --job-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Compiled worker smoke failed" }
          & $exe.FullName --restart-recovery-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Compiled restart recovery smoke failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QSG_RHI_BACKEND = "software"
          & $exe.FullName --qml-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Compiled QML smoke failed" }
          & $exe.FullName --performance-probe
          if ($LASTEXITCODE -ne 0) { throw "Compiled performance probe failed" }
      - name: Package developer portable + provenance
        shell: pwsh
        run: uv run python -m ml_lab.release.windows --dist deployment/main.dist --output deployment/release --source-commit "$env:SOURCE_COMMIT" --lock uv.lock
      - name: Retain Phase 4 developer packaging evidence
        uses: actions/upload-artifact@v4
        with:
          name: MLLab-phase4-developer-${{ env.SOURCE_COMMIT }}
          path: deployment/release
          if-no-files-found: error
          retention-days: 14
