name: Phase A fixture seed checks

on:
  push:
    branches: [phase/a-fixture-seed]
  workflow_dispatch:

jobs:
  fixture-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ML Lab
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.12"

      - run: uv sync --extra dev

      - name: Focused static checks
        run: |
          uv run ruff check src/ml_lab/adapters/phase_a_fixture_export.py tests/test_phase_a_fixture_export.py tests/test_phase_a_fixture_seed.py
          uv run mypy src/ml_lab/adapters/phase_a_fixture_export.py

      - name: Fixture bridge and seed checks
        run: |
          uv run pytest -q tests/test_phase_a_fixture_export.py tests/test_phase_a_fixture_seed.py

      - name: Pinned integration disclosure
        run: |
          echo "Pinned Frankenhomie integration requires ML_LAB_FRANKENHOMIE_REPO."
          echo "This branch CI has no cross-repository credential and does not claim that execution gate."
