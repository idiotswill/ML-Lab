name: Phase A fixture seed checks

on:
  push:
    branches: [phase/a-fixture-seed, phase/a-fixture-receipt-runner, phase/a-v2-baselines, phase/a-authoritative-dataset-factory, phase/a-freeze-train-dev, phase/a-first-sparse-experiment, phase/a-candidate-relative-sparse, phase/a-gui-dev-evidence]
  workflow_dispatch:

jobs:
  fixture-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ML Lab
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: "3.12"

      - run: uv sync --extra dev

      - name: Focused static checks
        run: |
          uv run ruff check src/ml_lab/app.py src/ml_lab/adapters/phase_a_fixture_export.py src/ml_lab/adapters/phase_a_fixture_seed.py src/ml_lab/adapters/phase_a_baselines.py src/ml_lab/adapters/phase_a_dataset_factory.py src/ml_lab/adapters/phase_a_freeze.py src/ml_lab/adapters/phase_a_first_experiment.py src/ml_lab/adapters/phase_a_candidate_experiment.py src/ml_lab/trainers/phase_a_candidate_sparse.py src/ml_lab/trainers/service.py src/ml_lab/jobs/worker.py src/ml_lab/evaluation/phase_a.py src/ml_lab/evaluation/runners.py src/ml_lab/ui/compare.py src/ml_lab/ui/phase_a_science.py tests/test_phase_a_fixture_export.py tests/test_phase_a_fixture_seed.py tests/test_phase_a_fixture_seed_evidence.py tests/test_phase_a_fixture_evidence_cli.py tests/test_phase_a_baselines.py tests/test_phase_a_baseline_cli.py tests/test_phase_a_dataset_factory.py tests/test_phase_a_dataset_factory_cli.py tests/test_phase_a_freeze.py tests/test_phase_a_freeze_cli.py tests/test_phase_a_first_experiment.py tests/test_phase_a_first_experiment_cli.py tests/test_phase_a_candidate_sparse.py tests/test_phase_a_candidate_experiment_cli.py tests/test_training_service.py tests/test_compare.py tests/test_phase_a_science.py
          uv run mypy src/ml_lab/app.py src/ml_lab/adapters/phase_a_fixture_export.py src/ml_lab/adapters/phase_a_fixture_seed.py src/ml_lab/adapters/phase_a_baselines.py src/ml_lab/adapters/phase_a_dataset_factory.py src/ml_lab/adapters/phase_a_freeze.py src/ml_lab/adapters/phase_a_first_experiment.py src/ml_lab/adapters/phase_a_candidate_experiment.py src/ml_lab/trainers/phase_a_candidate_sparse.py src/ml_lab/trainers/service.py src/ml_lab/jobs/worker.py src/ml_lab/evaluation/phase_a.py src/ml_lab/evaluation/runners.py src/ml_lab/ui/compare.py src/ml_lab/ui/phase_a_science.py

      - name: Fixture bridge and seed checks
        run: |
          uv run pytest -q tests/test_phase_a_fixture_export.py tests/test_phase_a_fixture_seed.py tests/test_phase_a_fixture_seed_evidence.py tests/test_phase_a_fixture_evidence_cli.py tests/test_phase_a_baselines.py tests/test_phase_a_baseline_cli.py tests/test_phase_a_dataset_factory.py tests/test_phase_a_dataset_factory_cli.py tests/test_phase_a_freeze.py tests/test_phase_a_freeze_cli.py tests/test_phase_a_first_experiment.py tests/test_phase_a_first_experiment_cli.py tests/test_phase_a_candidate_sparse.py tests/test_phase_a_candidate_experiment_cli.py tests/test_training_service.py

      - name: Pinned integration disclosure
        run: |
          echo "Pinned Frankenhomie integration requires ML_LAB_FRANKENHOMIE_REPO."
          echo "This branch CI has no cross-repository credential and does not claim that execution gate."
